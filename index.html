<!DOCTYPE html>
<html lang="si">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TriLingual AI • Sinhala English Tamil</title>
  <style>
    :root {
      --bg: #0c0c0f;
      --sidebar: #111114;
      --surface: #18181c;
      --surface2: #222228;
      --border: #2a2a32;
      --text: #ececef;
      --text-muted: #8b8b9a;
      --primary: #8b5cf6;
      --primary-hover: #7c3aed;
      --user-bg: #2e1065;
      --bot-bg: #1a1a1f;
      --success: #34d399;
      --danger: #f87171;
      --radius: 14px;
      --sidebar-w: 260px;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      overflow: hidden;
    }

    /* ========== SIDEBAR ========== */
    #sidebar {
      width: var(--sidebar-w);
      background: var(--sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: margin-left 0.25s ease, width 0.25s ease;
    }

    #sidebar.collapsed {
      margin-left: calc(-1 * var(--sidebar-w));
    }

    .sidebar-header {
      padding: 18px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
    }

    .logo-text {
      font-weight: 700;
      font-size: 1.05rem;
      background: linear-gradient(135deg, #c4b5fd, #93c5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .sidebar-body {
      flex: 1;
      padding: 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .side-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 11px 14px;
      border-radius: 10px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text);
      font-size: 0.92rem;
      cursor: pointer;
      transition: all 0.15s;
      text-align: left;
      width: 100%;
    }

    .side-btn:hover {
      background: var(--surface2);
      border-color: var(--border);
    }

    .side-btn.primary {
      background: var(--primary);
      border-color: var(--primary);
      font-weight: 600;
    }

    .side-btn.primary:hover {
      background: var(--primary-hover);
    }

    .sidebar-footer {
      padding: 14px;
      border-top: 1px solid var(--border);
    }

    .api-status {
      font-size: 0.75rem;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--danger);
    }

    .dot.ok { background: var(--success); }

    /* ========== MAIN ========== */
    #main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    /* Top bar */
    .topbar {
      height: 56px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 12px;
      background: var(--bg);
      flex-shrink: 0;
    }

    .menu-btn {
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--text);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      transition: all 0.15s;
    }

    .menu-btn:hover { background: var(--surface2); }

    .topbar-title {
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-muted);
    }

    .lang-badges {
      display: flex;
      gap: 6px;
      margin-left: auto;
    }

    .lang-badge {
      font-size: 0.7rem;
      padding: 3px 9px;
      border-radius: 20px;
      background: var(--surface2);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    /* Chat */
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 24px 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .message {
      max-width: 780px;
      width: 100%;
      margin: 0 auto;
      display: flex;
      gap: 12px;
      animation: fadeIn 0.25s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .message.user { flex-direction: row-reverse; }

    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      flex-shrink: 0;
    }

    .message.user .avatar { background: var(--user-bg); }
    .message.bot .avatar {
      background: linear-gradient(135deg, #8b5cf6, #6366f1);
    }

    .bubble-wrap {
      display: flex;
      flex-direction: column;
      gap: 6px;
      max-width: calc(100% - 50px);
    }

    .message.user .bubble-wrap { align-items: flex-end; }

    .bubble {
      padding: 12px 16px;
      border-radius: var(--radius);
      line-height: 1.55;
      font-size: 0.96rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.user .bubble {
      background: var(--user-bg);
      border-bottom-right-radius: 4px;
    }

    .message.bot .bubble {
      background: var(--bot-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .msg-actions {
      display: flex;
      gap: 4px;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .message:hover .msg-actions { opacity: 1; }

    .action-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      font-size: 0.75rem;
      padding: 4px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .action-btn:hover {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }

    .typing {
      display: flex;
      gap: 5px;
      padding: 14px 18px;
    }

    .typing span {
      width: 7px;
      height: 7px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.2s infinite;
    }
    .typing span:nth-child(2) { animation-delay: 0.15s; }
    .typing span:nth-child(3) { animation-delay: 0.3s; }

    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-5px); }
    }

    /* Welcome */
    .welcome {
      text-align: center;
      padding: 50px 20px;
      max-width: 540px;
      margin: auto;
    }

    .welcome h1 {
      font-size: 1.7rem;
      margin-bottom: 10px;
      background: linear-gradient(135deg, #c4b5fd, #93c5fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .welcome p {
      color: var(--text-muted);
      margin-bottom: 28px;
      line-height: 1.6;
      font-size: 0.95rem;
    }

    .examples {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    @media (max-width: 560px) {
      .examples { grid-template-columns: 1fr; }
    }

    .example {
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.15s;
      text-align: left;
      color: var(--text);
    }

    .example:hover {
      background: var(--surface2);
      border-color: var(--primary);
    }

    /* Input */
    #input-area {
      padding: 16px;
      border-top: 1px solid var(--border);
      background: var(--bg);
      flex-shrink: 0;
    }

    .input-box {
      max-width: 780px;
      margin: 0 auto;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      display: flex;
      align-items: flex-end;
      padding: 8px 8px 8px 16px;
      transition: border-color 0.15s;
    }

    .input-box:focus-within {
      border-color: var(--primary);
    }

    textarea {
      flex: 1;
      background: transparent;
      border: none;
      color: var(--text);
      padding: 10px 0;
      font-size: 0.98rem;
      font-family: inherit;
      resize: none;
      max-height: 140px;
      outline: none;
      line-height: 1.45;
    }

    #send-btn {
      background: var(--primary);
      border: none;
      color: white;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.15rem;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    #send-btn:hover:not(:disabled) { background: var(--primary-hover); }
    #send-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    .hint {
      max-width: 780px;
      margin: 8px auto 0;
      font-size: 0.72rem;
      color: var(--text-muted);
      text-align: center;
    }

    /* Settings Modal */
    #settings-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.65);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    #settings-modal.open { display: flex; }

    .modal {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 18px;
      width: 100%;
      max-width: 420px;
      padding: 24px;
    }

    .modal h3 {
      font-size: 1.15rem;
      margin-bottom: 18px;
    }

    .field { margin-bottom: 14px; }

    label {
      display: block;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input[type="password"],
    input[type="text"],
    select {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 11px 14px;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
    }

    input:focus, select:focus { border-color: var(--primary); }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .btn {
      flex: 1;
      padding: 11px;
      border-radius: 10px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      font-size: 0.95rem;
    }

    .btn-primary {
      background: var(--primary);
      color: white;
    }
    .btn-primary:hover { background: var(--primary-hover); }

    .btn-ghost {
      background: var(--surface2);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .status-msg {
      font-size: 0.8rem;
      margin-top: 12px;
      color: var(--text-muted);
    }
    .status-msg.ok { color: var(--success); }
    .status-msg.err { color: var(--danger); }

    /* Scrollbar */
    #chat::-webkit-scrollbar,
    .sidebar-body::-webkit-scrollbar { width: 5px; }
    #chat::-webkit-scrollbar-thumb,
    .sidebar-body::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 3px;
    }

    /* Mobile */
    @media (max-width: 700px) {
      #sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        z-index: 50;
        box-shadow: 4px 0 24px rgba(0,0,0,0.4);
      }
      #sidebar.collapsed { margin-left: calc(-1 * var(--sidebar-w)); }
    }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <aside id="sidebar">
    <div class="sidebar-header">
      <div class="logo-icon">🤖</div>
      <div class="logo-text">TriLingual AI</div>
    </div>

    <div class="sidebar-body">
      <button class="side-btn primary" id="new-chat-btn">＋ New Chat</button>
      <button class="side-btn" id="settings-btn">⚙️ Settings</button>
      <button class="side-btn" id="clear-btn">🗑️ Clear Chat</button>
    </div>

    <div class="sidebar-footer">
      <div class="api-status">
        <span class="dot" id="api-dot"></span>
        <span id="api-label">API Key not set</span>
      </div>
    </div>
  </aside>

  <!-- MAIN -->
  <div id="main">
    <div class="topbar">
      <button class="menu-btn" id="menu-btn" title="Toggle sidebar">☰</button>
      <div class="topbar-title">Sinhala • English • Tamil Chatbot</div>
      <div class="lang-badges">
        <span class="lang-badge">සිං</span>
        <span class="lang-badge">EN</span>
        <span class="lang-badge">தமிழ்</span>
      </div>
    </div>

    <div id="chat">
      <div class="welcome" id="welcome">
        <h1>ආයුබෝවන්! வணக்கம்! Hello!</h1>
      </div>
    </div>

    <div id="input-area">
      <div class="input-box">
        <textarea id="user-input" rows="1" placeholder="Type in Sinhala, English or Tamil..."></textarea>
        <button id="send-btn" title="Send">➤</button>
  </div>

  <!-- SETTINGS MODAL -->
  <div id="settings-modal">
    <div class="modal">
      <h3>⚙️ Settings</h3>
      <div class="field">
        <label>Gemini API Key (Free)</label>
        <input type="password" id="api-key" placeholder="AIzaSy..." autocomplete="off" />
      </div>
      <div class="field">
        <label>Model</label>
        <select id="model">
          <option value="gemini-3.6-flash">gemini-3.6-flash (Recommended)</option>
          <option value="gemini-3.8-flash">gemini-3.8-flash</option>
          <option value="gemini-3.5-flash">gemini-3.5-flash</option>
          <option value="gemini-2.5-flash">gemini-2.5-flash</option>
        </select>
      </div>
      <div class="status-msg" id="key-status">
        Free key: <a href="https://aistudio.google.com/apikey" target="_blank" style="color:#a78bfa">aistudio.google.com</a>
      </div>
      <div class="modal-actions">
        <button class="btn btn-ghost" id="close-settings">Cancel</button>
        <button class="btn btn-primary" id="save-key">Save</button>
      </div>
    </div>
  </div>

  <script>
    const SYSTEM_PROMPT = `You are a helpful, friendly, and highly capable AI assistant.
Always reply in the SAME language the user used in their latest message.
Supported languages: Sinhala (සිංහල), English, and Tamil (தமிழ்).
- Sinhala → reply fully in Sinhala
- English → reply fully in English
- Tamil → reply fully in Tamil
Be accurate, clear and helpful.`;

    let conversationHistory = [];
    let isGenerating = false;

    // DOM
    const sidebar = document.getElementById('sidebar');
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const welcomeEl = document.getElementById('welcome');
    const settingsModal = document.getElementById('settings-modal');
    const apiKeyInput = document.getElementById('api-key');
    const modelSelect = document.getElementById('model');
    const keyStatus = document.getElementById('key-status');
    const apiDot = document.getElementById('api-dot');
    const apiLabel = document.getElementById('api-label');

    // Load saved
    const savedKey = localStorage.getItem('gemini_api_key') || '';
    const savedModel = localStorage.getItem('gemini_model') || 'gemini-3.6-flash';
    if (savedKey) {
      apiKeyInput.value = savedKey;
      updateApiStatus(true);
    }
    modelSelect.value = savedModel;

    function updateApiStatus(ok) {
      apiDot.className = 'dot' + (ok ? ' ok' : '');
      apiLabel.textContent = ok ? 'API Key ready' : 'API Key not set';
    }

    // Sidebar toggle
    document.getElementById('menu-btn').onclick = () => {
      sidebar.classList.toggle('collapsed');
    };

    // New chat
    document.getElementById('new-chat-btn').onclick = () => {
      conversationHistory = [];
      chatEl.innerHTML = '';
      chatEl.appendChild(welcomeEl);
      welcomeEl.style.display = 'block';
    };

    // Clear
    document.getElementById('clear-btn').onclick = () => {
      if (confirm('Clear all messages?')) {
        conversationHistory = [];
        chatEl.innerHTML = '';
        chatEl.appendChild(welcomeEl);
        welcomeEl.style.display = 'block';
      }
    };

    // Settings
    document.getElementById('settings-btn').onclick = () => {
      settingsModal.classList.add('open');
    };
    document.getElementById('close-settings').onclick = () => {
      settingsModal.classList.remove('open');
    };
    settingsModal.onclick = (e) => {
      if (e.target === settingsModal) settingsModal.classList.remove('open');
    };

    document.getElementById('save-key').onclick = () => {
      const key = apiKeyInput.value.trim();
      if (!key) {
        keyStatus.textContent = '⚠️ Please enter an API key';
        keyStatus.className = 'status-msg err';
        return;
      }
      localStorage.setItem('gemini_api_key', key);
      localStorage.setItem('gemini_model', modelSelect.value);
      keyStatus.textContent = '✅ Saved successfully!';
      keyStatus.className = 'status-msg ok';
      updateApiStatus(true);
      setTimeout(() => settingsModal.classList.remove('open'), 700);
    };

    // Auto resize
    inputEl.addEventListener('input', () => {
      inputEl.style.height = 'auto';
      inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
    });

    // Examples
    document.querySelectorAll('.example').forEach(el => {
      el.onclick = () => {
        inputEl.value = el.dataset.q;
        inputEl.focus();
        sendMessage();
      };
    });

    // Send
    inputEl.addEventListener('keydown', e => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
      }
    });
    sendBtn.onclick = sendMessage;

    function escapeHtml(text) {
      const d = document.createElement('div');
      d.textContent = text;
      return d.innerHTML;
    }

    function addMessage(role, text) {
      welcomeEl.style.display = 'none';
      const div = document.createElement('div');
      div.className = `message ${role}`;

      const bubbleId = 'msg-' + Date.now() + Math.random().toString(36).slice(2, 6);

      div.innerHTML = `
        <div class="avatar">${role === 'user' ? '👤' : '🤖'}</div>
        <div class="bubble-wrap">
          <div class="bubble" id="${bubbleId}">${escapeHtml(text)}</div>
          ${role === 'bot' ? `
            <div class="msg-actions">
              <button class="action-btn" onclick="copyMessage('${bubbleId}')">📋 Copy</button>
            </div>
          ` : ''}
        </div>
      `;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
      return div;
    }

    window.copyMessage = function(id) {
      const el = document.getElementById(id);
      if (!el) return;
      navigator.clipboard.writeText(el.innerText).then(() => {
        const btn = el.parentElement.querySelector('.action-btn');
        if (btn) {
          btn.textContent = '✅ Copied';
          setTimeout(() => btn.textContent = '📋 Copy', 1500);
        }
      });
    };

    function showTyping() {
      const div = document.createElement('div');
      div.className = 'message bot';
      div.id = 'typing-indicator';
      div.innerHTML = `
        <div class="avatar">🤖</div>
        <div class="bubble-wrap">
          <div class="bubble typing"><span></span><span></span><span></span></div>
        </div>
      `;
      chatEl.appendChild(div);
      chatEl.scrollTop = chatEl.scrollHeight;
    }

    function removeTyping() {
      const el = document.getElementById('typing-indicator');
      if (el) el.remove();
    }

    async function sendMessage() {
      const text = inputEl.value.trim();
      if (!text || isGenerating) return;

      const apiKey = localStorage.getItem('gemini_api_key');
      if (!apiKey) {
        settingsModal.classList.add('open');
        keyStatus.textContent = '⚠️ Please enter your free Gemini API key first';
        keyStatus.className = 'status-msg err';
        return;
      }

      isGenerating = true;
      sendBtn.disabled = true;
      inputEl.value = '';
      inputEl.style.height = 'auto';

      addMessage('user', text);
      conversationHistory.push({ role: 'user', parts: [{ text }] });
      showTyping();

      try {
        const model = localStorage.getItem('gemini_model') || 'gemini-3.6-flash';
        const url = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${apiKey}`;

        const contents = conversationHistory.map(m => ({
          role: m.role === 'user' ? 'user' : 'model',
          parts: m.parts
        }));

        const body = {
          system_instruction: { parts: [{ text: SYSTEM_PROMPT }] },
          contents,
          generationConfig: { temperature: 0.7, maxOutputTokens: 2048 }
        };

        const res = await fetch(url, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(body)
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error?.message || `HTTP ${res.status}`);

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'Sorry, no response.';
        removeTyping();
        addMessage('bot', reply);
        conversationHistory.push({ role: 'model', parts: [{ text: reply }] });

        if (conversationHistory.length > 20) {
          conversationHistory = conversationHistory.slice(-16);
        }
      } catch (err) {
        removeTyping();
        addMessage('bot', `⚠️ Error: ${err.message}\n\nPlease check your API key or try another model.`);
      } finally {
        isGenerating = false;
        sendBtn.disabled = false;
        inputEl.focus();
      }
    }
  </script>
</body>
</html>
